<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevBlog - A modern blogging platform for developers">
    <title>DevBlog — A Developer Blogging Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">DevBlog</a>
        <button id="menu-btn" class="menu-btn">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#explore">Explore</a></li>
                <li><a href="write.html">Write</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h1>Welcome to DevBlog</h1>
            <p>Share your stories, ideas, and knowledge with the world</p>
            <input type="text" id="search-input" placeholder="Search posts by title or content...">
        </section>

        <section class="featured-posts" id="explore">
            <h2>Latest Posts</h2>

            <div class="toolbar">
                <label for="sort-select">Sort by</label>
                <select id="sort-select">
                    <option value="latest">Newest</option>
                    <option value="popular">Most liked</option>
                </select>
            </div>

            <p class="list-status" id="post-status">Loading posts…</p>
            <div class="post-list" id="post-list"></div>

            <nav class="pagination" id="pagination" hidden>
                <button type="button" class="btn btn-small" id="prev-page">Previous</button>
                <span id="page-info"></span>
                <button type="button" class="btn btn-small" id="next-page">Next</button>
            </nav>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#privacy">Privacy</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </footer>

    <button id="scroll-top-btn" class="scroll-top-btn">&#8679;</button>

    <script src="script.js"></script>
</body>
</html>
