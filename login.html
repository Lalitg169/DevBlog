<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevBlog - Login to your account">
    <title>Login — DevBlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">DevBlog</a>
        <button id="menu-btn" class="menu-btn">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#explore">Explore</a></li>
                <li><a href="write.html">Write</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- LOGIN / REGISTER FORM -->
        <section class="hero">
            <h1 id="auth-title">Welcome Back</h1>
            <p id="auth-subtitle">Login to continue to DevBlog</p>
        </section>

        <section class="form-section">
            <form id="login-form" class="post-form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>

                <button type="submit" class="btn" id="auth-submit" data-mode="login">Login</button>

                <p class="form-message" id="login-message"></p>
                <p class="auth-switch">
                    <span id="auth-switch-text">Need an account?</span>
                    <a href="#" id="auth-switch">Register</a>
                </p>
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#privacy">Privacy</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </footer>

    <!-- SCROLL TO TOP -->
    <button id="scroll-top-btn" class="scroll-top-btn">&#8679;</button>

    <script src="script.js"></script>
    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');
        const submitBtn = document.querySelector('#auth-submit');
        const switchLink = document.querySelector('#auth-switch');
        const switchText = document.querySelector('#auth-switch-text');
        const title = document.querySelector('#auth-title');
        const subtitle = document.querySelector('#auth-subtitle');
        const passwordInput = document.querySelector('#password');

        const copy = {
            login: {
                title: 'Welcome Back',
                subtitle: 'Login to continue to DevBlog',
                submit: 'Login',
                switchText: 'Need an account?',
                switchLink: 'Register',
                autocomplete: 'current-password',
            },
            register: {
                title: 'Create an Account',
                subtitle: 'Join DevBlog and start writing',
                submit: 'Register',
                switchText: 'Already have an account?',
                switchLink: 'Login',
                autocomplete: 'new-password',
            },
        };

        function setMode(mode) {
            const text = copy[mode];
            submitBtn.dataset.mode = mode;
            submitBtn.textContent = text.submit;
            title.textContent = text.title;
            subtitle.textContent = text.subtitle;
            switchText.textContent = text.switchText;
            switchLink.textContent = text.switchLink;
            passwordInput.setAttribute('autocomplete', text.autocomplete);
            passwordInput.placeholder = mode === 'register' ? 'At least 6 characters' : 'Your password';
            loginMessage.textContent = '';
            loginMessage.className = 'form-message';
        }

        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(submitBtn.dataset.mode === 'login' ? 'register' : 'login');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mode = submitBtn.dataset.mode;
            const username = document.querySelector('#username').value.trim();
            const password = passwordInput.value;

            loginMessage.className = 'form-message';
            submitBtn.disabled = true;

            try {
                const data = await api(`/auth/${mode}`, { method: 'POST', body: { username, password } });
                auth.save(data.token, data.user);
                loginMessage.classList.add('success');
                loginMessage.textContent = mode === 'register'
                    ? `Account created. Welcome, ${data.user.username}!`
                    : `Welcome back, ${data.user.username}!`;
                setTimeout(() => { window.location.href = 'index.html'; }, 600);
            } catch (err) {
                loginMessage.classList.add('error');
                loginMessage.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
