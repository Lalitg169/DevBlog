<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevBlog - Read a post">
    <title>Post — DevBlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">DevBlog</a>
        <button id="menu-btn" class="menu-btn">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#explore">Explore</a></li>
                <li><a href="write.html">Write</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p class="list-status" id="post-status">Loading post…</p>

        <article class="post-article" id="post-article" hidden></article>

        <section class="comments" id="comments" hidden>
            <h2>Comments (<span id="comment-count">0</span>)</h2>

            <form class="comment-form" id="comment-form" hidden>
                <textarea id="comment-content" rows="3" maxlength="1000" placeholder="Add a comment…" required></textarea>
                <button type="submit" class="btn btn-small">Post comment</button>
            </form>

            <p class="muted" id="comment-hint" hidden><a href="login.html">Log in</a> to join the conversation.</p>
            <p class="form-message" id="comment-message"></p>

            <p class="list-status" id="comment-status">Loading comments…</p>
            <ul class="comment-list" id="comment-list"></ul>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#privacy">Privacy</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </footer>

    <!-- SCROLL TO TOP -->
    <button id="scroll-top-btn" class="scroll-top-btn">&#8679;</button>

    <script src="script.js"></script>
    <script>
        const article = document.querySelector('#post-article');
        const postStatus = document.querySelector('#post-status');
        const commentsSection = document.querySelector('#comments');
        const commentList = document.querySelector('#comment-list');
        const commentStatus = document.querySelector('#comment-status');
        const commentForm = document.querySelector('#comment-form');
        const commentHint = document.querySelector('#comment-hint');
        const commentMessage = document.querySelector('#comment-message');
        const commentCount = document.querySelector('#comment-count');
        const postId = new URLSearchParams(window.location.search).get('id');

        function paragraphs(content) {
            if (!content || !content.trim()) return '<p class="muted">This post has no content yet.</p>';
            return content
                .split(/\n\s*\n/)
                .map((block) => `<p>${escapeHtml(block).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        /* LIKES */
        function setLikeState(liked, count) {
            const btn = document.querySelector('#like-btn');
            btn.classList.toggle('liked', Boolean(liked));
            btn.setAttribute('aria-pressed', String(Boolean(liked)));
            btn.querySelector('#like-count').textContent = count;
        }

        async function toggleLike() {
            const btn = document.querySelector('#like-btn');
            const note = document.querySelector('#like-note');

            if (!auth.token) {
                note.innerHTML = '<a href="login.html">Log in</a> to like this post.';
                return;
            }

            note.textContent = '';
            btn.disabled = true;
            try {
                const data = await api(`/posts/${encodeURIComponent(postId)}/like`, { method: 'POST', withAuth: true });
                setLikeState(data.liked, data.like_count);
            } catch (err) {
                note.textContent = err.message;
            } finally {
                btn.disabled = false;
            }
        }

        /* COMMENTS */
        function commentHtml(comment) {
            const user = auth.user;
            const canDelete = user && user.id === comment.user_id;
            return `
                <li class="comment" data-id="${comment.id}">
                    <div class="comment-head">
                        <span class="author">${escapeHtml(comment.author)}</span>
                        <time datetime="${escapeHtml(comment.created_at)}">${formatDate(comment.created_at)}</time>
                        ${canDelete ? '<button type="button" class="comment-delete">Delete</button>' : ''}
                    </div>
                    <p>${escapeHtml(comment.content).replace(/\n/g, '<br>')}</p>
                </li>`;
        }

        function renderComments(comments) {
            commentList.innerHTML = comments.map(commentHtml).join('');
            commentCount.textContent = comments.length;
            commentStatus.hidden = comments.length > 0;
            if (comments.length === 0) commentStatus.textContent = 'No comments yet. Start the conversation.';
        }

        async function loadComments() {
            try {
                const { comments } = await api(`/posts/${encodeURIComponent(postId)}/comments`);
                renderComments(comments);
            } catch (err) {
                commentStatus.hidden = false;
                commentStatus.textContent = err.message;
            }
        }

        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const field = document.querySelector('#comment-content');
            const content = field.value.trim();
            if (!content) return;

            const submitBtn = commentForm.querySelector('button[type="submit"]');
            commentMessage.className = 'form-message';
            submitBtn.disabled = true;

            try {
                await api(`/posts/${encodeURIComponent(postId)}/comments`, {
                    method: 'POST',
                    withAuth: true,
                    body: { content },
                });
                field.value = '';
                await loadComments();
            } catch (err) {
                commentMessage.classList.add('error');
                commentMessage.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });

        commentList.addEventListener('click', async (e) => {
            const btn = e.target.closest('.comment-delete');
            if (!btn) return;

            const id = btn.closest('.comment').dataset.id;
            commentMessage.className = 'form-message';
            btn.disabled = true;

            try {
                await api(`/posts/${encodeURIComponent(postId)}/comments/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    withAuth: true,
                });
                await loadComments();
            } catch (err) {
                commentMessage.classList.add('error');
                commentMessage.textContent = err.message;
                btn.disabled = false;
            }
        });

        // The server is the real authority here — it rejects edits and deletes from
        // anyone but the author. This only decides whether to offer the controls.
        function isOwner(post) {
            const me = auth.user;
            return Boolean(auth.token && me && post.user_id === me.id);
        }

        function renderPost(post) {
            document.title = `${post.title} — DevBlog`;

            const ownerActions = isOwner(post)
                ? `<div class="owner-actions">
                        <button type="button" class="btn btn-small" id="edit-btn">Edit</button>
                        <button type="button" class="btn btn-small btn-danger" id="delete-btn">Delete</button>
                   </div>`
                : '';

            const edited = post.updated_at && post.updated_at !== post.created_at
                ? `<span class="edited">edited ${formatDate(post.updated_at)}</span>`
                : '';

            article.innerHTML = `
                <p class="back-link"><a href="index.html">&larr; All posts</a></p>
                ${post.category ? `<span class="category">${escapeHtml(post.category)}</span>` : ''}
                <h1>${escapeHtml(post.title)}</h1>
                <div class="article-meta">
                    <span class="author">${escapeHtml(post.author)}</span>
                    <time datetime="${escapeHtml(post.created_at)}">${formatDate(post.created_at)}</time>
                    ${edited}
                </div>
                ${ownerActions}
                <img class="cover" src="${escapeHtml(coverFor(post))}" alt="">
                <div class="post-body">${paragraphs(post.content)}</div>
                <div class="like-row">
                    <button type="button" class="like-btn" id="like-btn" aria-pressed="false">
                        <span aria-hidden="true">&hearts;</span> <span id="like-count">0</span>
                    </button>
                    <span class="form-message" id="like-note"></span>
                </div>
            `;

            setLikeState(post.liked, post.like_count);
            document.querySelector('#like-btn').addEventListener('click', toggleLike);

            if (isOwner(post)) {
                document.querySelector('#edit-btn').addEventListener('click', () => renderEditForm(post));
                document.querySelector('#delete-btn').addEventListener('click', () => deletePost(post));
            }
        }

        function renderEditForm(post) {
            article.innerHTML = `
                <p class="back-link"><a href="index.html">&larr; All posts</a></p>
                <h1>Edit post</h1>
                <form class="post-form" id="edit-form">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" maxlength="200" required value="${escapeHtml(post.title)}">

                    <label for="edit-category">Category</label>
                    <input type="text" id="edit-category" maxlength="50" value="${escapeHtml(post.category || '')}">

                    <label for="edit-cover">Cover image URL</label>
                    <input type="text" id="edit-cover" value="${escapeHtml(post.cover_image || '')}">

                    <label for="edit-content">Content</label>
                    <textarea id="edit-content" rows="10">${escapeHtml(post.content || '')}</textarea>

                    <div class="owner-actions">
                        <button type="submit" class="btn btn-small">Save changes</button>
                        <button type="button" class="btn btn-small btn-quiet" id="cancel-edit">Cancel</button>
                    </div>
                    <p class="form-message" id="edit-message"></p>
                </form>
            `;

            const form = document.querySelector('#edit-form');
            const message = document.querySelector('#edit-message');
            const save = form.querySelector('button[type="submit"]');

            document.querySelector('#cancel-edit').addEventListener('click', () => renderPost(post));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                message.className = 'form-message';
                save.disabled = true;

                const category = document.querySelector('#edit-category').value.trim();

                try {
                    const { post: updated } = await api(`/posts/${encodeURIComponent(post.id)}`, {
                        method: 'PUT',
                        withAuth: true,
                        body: {
                            title: document.querySelector('#edit-title').value.trim(),
                            content: document.querySelector('#edit-content').value,
                            cover_image: document.querySelector('#edit-cover').value.trim(),
                            // An empty box clears the category rather than keeping the old one.
                            ...(category ? { category } : { category_id: null }),
                        },
                    });
                    renderPost(updated);
                } catch (err) {
                    message.classList.add('error');
                    message.textContent = err.message;
                    save.disabled = false;
                }
            });
        }

        async function deletePost(post) {
            if (!window.confirm(`Delete “${post.title}”? This cannot be undone.`)) return;

            const btn = document.querySelector('#delete-btn');
            btn.disabled = true;

            try {
                await api(`/posts/${encodeURIComponent(post.id)}`, { method: 'DELETE', withAuth: true });
                window.location.href = 'index.html';
            } catch (err) {
                btn.disabled = false;
                postStatus.hidden = false;
                postStatus.textContent = err.message;
            }
        }

        async function loadPost() {
            if (!postId) {
                postStatus.textContent = 'No post selected.';
                return;
            }

            try {
                const { post } = await api(`/posts/${encodeURIComponent(postId)}`, { withAuth: true });
                renderPost(post);

                postStatus.hidden = true;
                article.hidden = false;
                commentsSection.hidden = false;
                commentForm.hidden = !auth.token;
                commentHint.hidden = Boolean(auth.token);

                loadComments();
            } catch (err) {
                postStatus.textContent = err.message;
            }
        }

        loadPost();
    </script>
</body>
</html>
