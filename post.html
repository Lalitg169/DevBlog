<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevBlog - Read a post">
    <title>Post — DevBlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">DevBlog</a>
        <button id="menu-btn" class="menu-btn">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#explore">Explore</a></li>
                <li><a href="write.html">Write</a></li>
                <li id="nav-auth"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p class="list-status" id="post-status">Loading post…</p>
        <article class="post-article" id="post-article" hidden></article>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#privacy">Privacy</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </footer>

    <!-- SCROLL TO TOP -->
    <button id="scroll-top-btn" class="scroll-top-btn">&#8679;</button>

    <script src="script.js"></script>
    <script>
        const article = document.querySelector('#post-article');
        const status = document.querySelector('#post-status');
        const postId = new URLSearchParams(window.location.search).get('id');

        function paragraphs(content) {
            if (!content || !content.trim()) return '<p class="muted">This post has no content yet.</p>';
            return content
                .split(/\n\s*\n/)
                .map((block) => `<p>${escapeHtml(block).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        async function loadPost() {
            if (!postId) {
                status.textContent = 'No post selected.';
                return;
            }

            try {
                const { post } = await api(`/posts/${encodeURIComponent(postId)}`);
                document.title = `${post.title} — DevBlog`;

                article.innerHTML = `
                    <p class="back-link"><a href="index.html">&larr; All posts</a></p>
                    ${post.category ? `<span class="category">${escapeHtml(post.category)}</span>` : ''}
                    <h1>${escapeHtml(post.title)}</h1>
                    <div class="article-meta">
                        <span class="author">${escapeHtml(post.author)}</span>
                        <time datetime="${escapeHtml(post.created_at)}">${formatDate(post.created_at)}</time>
                        <span>${post.like_count} likes</span>
                        <span>${post.comment_count} comments</span>
                    </div>
                    <img class="cover" src="${escapeHtml(coverFor(post))}" alt="">
                    <div class="post-body">${paragraphs(post.content)}</div>
                `;

                status.hidden = true;
                article.hidden = false;
            } catch (err) {
                status.textContent = err.message;
            }
        }

        loadPost();
    </script>
</body>
</html>
