services:
  db:
    image: postgres:16-alpine
    container_name: devblog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devblog
      POSTGRES_PASSWORD: devblog
      POSTGRES_DB: devblog
    # 5433 on the host so this never collides with a system Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - devblog-data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devblog -d devblog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devblog-data:
